monthly_refresh:
  - "which closed clients beat their 90-day plan? add that vertical to preferred"
  - "which verticals churned or disputed scope? move to avoid"
  - "which vertical did the top 3 Tier-C rejects come from? fix the magnet or the message"
  - "any new ad-policy or platform change hitting a vertical? patch that vertical's playbook"

intent: >
  You chose "general", which is fine as a starting position and fatal as an ending one. The OS markets
  general, prefers these verticals internally, and lets the case-study library become the niche by month
  6 — at which point premium pricing stops being a claim and starts being a record.

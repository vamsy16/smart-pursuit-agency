    why: "Almost nobody markets well here; ₹10L is a rounding error; long retention"
  - name: "SaaS / funded startup (pre-Series B)"
    why: "Budget exists, values speed, AI-native buyers — they respect the OS"
  - name: "D2C above ₹1Cr revenue"
    why: "Clear numbers, fast proof; churn risk, so keep under 30% of the book"
  - name: "CA / legal / premium professional services"

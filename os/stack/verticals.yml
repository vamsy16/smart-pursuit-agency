# Vertical Preference Table — consumed by Engine 00 (score bonus) and Engine 01 (what to write about)
# Refreshed monthly by R-07 retro. Do NOT hardcode a niche into the front door — only into the preference.
# Valid YAML: agents read this file as data.

updated: "2026-09-03"

preferred:                       # +12 · ₹10L is normal here; data is obtainable; servable solo + AI
  - name: "Real estate & construction"
    why: "Ticket ₹30L–2Cr, hungry for leads, local premium, little marketing sophistication"
    where: "Vizag / Hyderabad / Coimbatore"

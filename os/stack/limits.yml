# Quota & limits — ACTIVE MODE ONLY (semi-auto, one public repo, no API keys).
# The point of this file is that we have almost nothing to blow. Rule A9: check before using a metered
# service; at 80% of any quota, park the job and tell the founder — never retry a 429.

github:
  plan: free
  repos: unlimited, public and private
  collaborators: unlimited
  actions: "unmetered on this public repo → guard + site build are free"
  actions_minutes_private: 2000        # only if we later add a private repo
  pages: "free here because the repo is public; private Pages needs Pro ($4/mo ≈ ₹350)"
  runners: "ubuntu-latest only — Windows 2×, macOS 10× minutes; never a larger-runner label"
  one_job_budget: "< 2 minutes, concurrency group set, no self-triggering loops"
arena_agent:
  role: the runtime of this OS — the nine roles, the gate, the vault work
  ceiling: "your plan's usage limit; the only real throughput constraint in the design"
  discipline: "one ritual per session · batch by task type (produce all seo) · checkpoint every sub-step"
git_size:
  vault_growth_monthly: "10–20 MB at 8 clients (gzip before encrypt, one seal per session)"
  github_soft_limit: 1 GB
  github_hard_limit: 5 GB
  policy: "no exports/PDFs/CSVs/screenshots in the repo — vault or off GitHub; history squash yearly"
never_needed_in_this_mode: "API rate limits, free-tier training-data worries, VM reclamation, build-minute caps"

dormant:                       # ← only if/when revenue buys it; see design/05 upgrade ladder
  paid_ai_tier: "unlocks overnight content batches + auto pulls = the 14 daemons switch on"
  zoho_books: "Standard ₹899/mo past ₹25L turnover, or for GST return filing"
  smtp_relay: "only if we send volume from a custom domain (Gmail send-as ends Jan 2027)"
  google_apis: "GA4/GSC pulls replace the ingest ritual; consent + privacy note to the client first"

# Quota Ledger — read before using any metered service (Rule A9). Refreshed by D13/R-07.
# In the ACTIVE semi-auto mode almost none of this applies (no API keys) — kept so a future
# upgrade is a decision, not a discovery. Valid YAML on purpose: tools and agents parse this file.

github:
  plan: free
  actions_minutes_private_month: 2000
  actions_minutes_public: unmetered        # this repo is public → guard + site jobs are free
  packages_storage_mb: 500
  pages: "public repos only on free plan; private Pages needs Pro ($4/mo)"
  budget_pct: 60                            # jobs must stay under this share
  runner: "ubuntu-latest only — Windows 2x, macOS 10x minutes; never a larger-runner label"
arena_agent:
  model: session-based
  note: "the compute in this design; batch one ritual per session, checkpoint each sub-step"
  ceilings: "plan usage limits — unknown to the repo; assume scarce, so keep sessions short"
gemini_api_free:
  enabled: false
  requests_per_day: 1500
  rpm: 15
  models_free: "Flash / Flash-Lite only (Pro effectively removed)"
  batch_budget_per_day: 600
  privacy: "free tier may train on inputs — see SOVEREIGN 5.4"
oracle_cloud_free:
  enabled: false
  shape: "2 OCPU / 12GB ARM (halved from 4/24 in Jun 2026)"
  storage_gb: 200
  egress_tb_month: 10
  risk: "idle instances reclaimed; ARM images only; no critical path may depend on it"
email:
  mode: gmail_direct
  cloudflare_routing_inbound: unused
  smtp_relay: unused
  note: "Gmail send-as for custom domains ends Jan 2027; buy the domain, then move sending if volume demands"
hubspot_free:
  enabled: false
  crm: "not needed — os/pipeline/leads.yml is the CRM"
notion_free:
  enabled: false
canva_free:
  brand_kit: false
  magic_resize: false
  workaround: "own template system from R5 — no Pro required"
zoho_books_free:
  enabled: false
  turnover_limit_inr: 2500000
  users: 1
  transactions_year: 1000
  gst_filing: false
razorpay:
  card_fee_pct: 2.0
  upi_fee_pct: 0
whatsapp_business:
  app: free
  api: "NOT free — never promise it to a client"

escalation_rule: >
  Any service at 80% of a monthly quota: park the job, tell the founder, propose an upgrade or a
  fallback. Never retry a 429 — that is how a free tool is lost for a month.

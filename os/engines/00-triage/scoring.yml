# Lead Scoring — Smart Pursuit (v1)
# Consumed by R-02 intake / Engine 00. Max 100 + vertical bonus; score is written on the lead record.
# Budget_fit is not a nice-to-have: a ₹40k/mo lead becomes a ₹1L/mo retainer maybe once in 100, after
# 40 hours of persuasion. Score honestly and the OS hands your time back. Valid YAML — agents read it as data.

weights:
  budget_fit:                # 0-30 · the gate; 0 here caps the lead at Tier B
    "15-40k/mo or unknown": 0
    "40k-1L/mo": 10
    "1-3L/mo": 22
    "3L+/mo": 30
  ltv_economics:             # 0-15 · can our work pay for itself?
    unclear: 0
    "5-25k per sale": 7
    "25k-2L per sale, or subscription/SaaS": 15
  decision_access:           # 0-15
    blocker: 0
    influencer: 6
    "owner/founder on call": 15
  clarity_of_goal:           # 0-10 · can they name one metric?
    vague: 0
    "named metric + timeframe": 10
  marketing_maturity:        # 0-10 · tried things = coachable; zero = you'll be educating, not growing
    none: 3                  # 3 not 0: a blank slate can be good, just slower
    inconsistent_attempts: 10
    in_house_team_we_complement: 7
  urgency:                   # 0-10
    exploring: 0
    this_quarter: 6
    "ASAP / budget approved": 10
  fit_for_us:                # 0-10 · deliverable well, solo + AI?
    "24/7 ops, huge creative volume, or offline-heavy": 0
    clean_digital_funnel: 10
  source_quality:            # 0-5
    cold_outbound_reply: 2
    "warm referral or inbound content": 5
  vertical_bonus:            # 0-12 · from os/stack/verticals.yml
    preferred: 12
    adjacent: 6
    other: 0

hard_fails:                  # Tier C regardless of total
  - requests black-hat SEO, fake reviews, or bought followers
  - pay-only-after-results, or free for a month then a big budget
  - abusive behaviour or murky payment terms after a past agency dispute
  - needs more than 40 hrs/month of human-only work we cannot supply
  - competitor or spy enquiry
  - asks us to invoice through a personal account or front their ad spend

routing:
  A:
    min: 80
    action: "founder call inside 24h · proposal inside 72h"
  B_plus:
    min: 60
    max: 79
    action: "productised only — Sprint ₹1L or Audit ₹25k. Never a discounted retainer."
  B:
    min: 40
    max: 59
    action: "nurture 90 days · 8 touches · offer the free teardown"
  C:
    max: 39
    action: "polite no + self-serve resource · log the reason · 3 minutes maximum"

sla:
  first_response_inbound: "5 minutes · drafted by the session, touched by a human"
  first_response_outbound_reply: "2 hours"
  qualification_done: "same day"
  proposal_sent: "72 hours from the call"
  no_answer_followup: "day 2, 5, 9 · then park"

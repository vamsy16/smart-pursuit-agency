# Public-scope contract — ONE public repo, two zones. Enforced by os/ops/tools/public-guard.sh in CI.

public:                     # ✅ readable by the world, on purpose — this is the shop window
  - site/**                 # the premium design + operating manual → GitHub Pages, ₹0
  - design/**               # the blueprint: proof-of-work, published deliberately
  - os/SOVEREIGN.md         # laws, red lines, the ₹1L floor — saying it publicly is the positioning
  - os/AGENTS.md os/kernel/** os/engines/** os/playbooks/** os/templates/**
  - os/sessions/** os/stack/** os/daemons/** os/ops/tools/** os/ops/{cadence,capacity}.md
  - os/clients/_template/** # structure only, never a real client
  - proof/**                # anonymised case studies + published autopsies

sealed:                     # 🔒 in this repo, but ciphertext only — the ledger stays in the same place
  - vault/pipeline.age      # leads, scores, won/lost, cash
  - vault/<client-slug>.age # the entire client folder: strategy, deliverables, comms, invoices, contracts,
                            # and its own tickets under 05-tasks/tickets/ — that is where a client's work lives

never:                      # ⛔ nothing below may exist as plaintext anywhere in this repo
  - any plaintext file under vault/            # guard: *.age only
  - .vault-work/**  tracked in git             # the decrypted working copy is gitignored
  - os/clients/<real-slug>/**                  # real client folders do not exist here
  - invoices, contracts, exports, PDFs, CSVs, account screenshots  # into the vault or off GitHub
  - os/ops/finance/ledger.yml                                      # books are sealed data, guard rule 2
  - any public ticket or ledger row naming a client                # guard rule 3c: client: internal only in os/pipeline/**
  - secrets, tokens, API keys                    # none exist in this design; keep it that way
  - client names, phone numbers, GSTIN, PAN, card numbers in any committed file
  - LICENSE                                      # no open-source licence = competitors may not copy the OS

rule: >
  Publish the machine, seal the memory. If a competitor or a client's CFO would care, it is sealed.
  The public zone is marketing; the vault is the company. Same repo, same clone, one passphrase.
  Full model and key policy: design/07-ONE-REPO-AI-OS.md

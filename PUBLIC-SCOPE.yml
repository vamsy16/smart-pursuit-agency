# Public-scope contract — what this PUBLIC repo may and may never contain
# Enforced mechanically by .github/workflows/public-guard.yml (CI goes red, not a promise).

public:                     # ✅ publish freely; this IS the marketing
  - site/**                 # the premium design + operating manual → GitHub Pages
  - design/**               # the blueprint, published deliberately: proof-of-work, and the lead magnet
  - os/SOVEREIGN.md         # laws, red lines, the floor — saying it publicly is the positioning
  - os/AGENTS.md
  - os/kernel/**            # roles, voice, quality gate, escalation
  - os/engines/**           # how we work (no client names, no numbers)
  - os/playbooks/** os/templates/**
  - os/stack/** os/daemons/** os/sessions/**
  - os/clients/_template/** # structure only
  - os/pipeline/stages.md os/pipeline/tickets/README.md
  - os/ops/{cadence,capacity}.md os/ops/bench/README.md os/ops/tools/**

private:                    # ⛔ lives in `smart-pursuit-os` (private repo, same account, same ₹0)
  - os/clients/<slug>/**    # every client folder, without exception
  - os/pipeline/leads.yml    # the prospect list is the revenue
  - os/pipeline/lost.md won.md
  - os/ops/finance/**        # ledger, invoices, tax
  - os/ops/bench/<names>.yml # people and rates
  - os/ops/secrets.index.md  # names of credentials
  - os/memory/**             # real logs, decisions, incidents
  - contracts, exports, PDFs, CSVs, screenshots of client accounts

why: >
  A public repo buys free hosted Pages, unmetered Actions and the strongest proof-of-work
  a one-person agency can publish. It costs confidentiality the instant a client exists.
  So the window and the ledger are separate repos: public shows the method, private holds the money.
  Rule of thumb — if a competitor or a client's CFO would care, it goes private.

switch: >
  Zero clients signed → publish everything here; it is your best Autopsy.
  The day an advance lands for client #1 → create the private repo and move the `private:` list,
  history included (git filter-repo). Forks today: 0. In month 6: not so clean.
